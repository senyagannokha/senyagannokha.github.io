<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light only">
<title>Rentapa · Pré-visualização · Tabela de preços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#fcfcfb;--bg:#F4F4F1;--card:#ffffff;--line:#E4E3DE;--grid:#ECEBE7;
  --ink:#1A1A1A;--ink-2:#52514e;--ink-3:#7A7974;--accent:#FFB81C;--accent-ink:#1A1A1A;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
  --seq-100:#cde2fb;--seq-200:#9ec5f4;--seq-300:#6da7ec;--seq-400:#3987e5;--seq-500:#256abf;--seq-600:#184f95;--seq-700:#0d366b;
  --good:#1E7A46;--good-bg:#E6F4EC;--warn:#8A5A00;--warn-bg:#FFF4D6;--bad:#B42318;--bad-bg:#FDECEA;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;font-size:.9375rem;color:inherit}
a{color:inherit}
.hidden{display:none!important}
/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;background:#1A1A1A;color:#fff}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.15rem;text-decoration:none}
.brand b{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:7px;background:var(--accent);color:#1A1A1A}
.brand span em{font-style:normal;color:var(--accent)}
.tabs{display:flex;gap:.25rem;overflow-x:auto;flex:1}
.tab{background:none;border:0;color:#cfcfcf;padding:.5rem .8rem;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap;min-height:2.5rem}
.tab[aria-selected="true"]{background:#333;color:#fff}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.row-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.who{font-size:.875rem;color:#cfcfcf;white-space:nowrap}
.wrap{max-width:1280px;margin:0 auto;padding:1.25rem}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-bottom:1.25rem}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:.4rem .75rem;border-radius:7px;cursor:pointer;font-weight:600;color:var(--ink-2);min-height:2.25rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chk{display:inline-flex;align-items:center;gap:.4rem;font-size:.875rem;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.45rem .85rem;cursor:pointer;font-weight:600;min-height:2.5rem;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.small{min-height:2rem;padding:.25rem .6rem;font-size:.875rem}
.spacer{flex:1}
.note{font-size:.875rem;color:var(--ink-3)}
.grid{display:grid;gap:1rem}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media (max-width:700px){.who{display:none}.top{gap:.5rem;padding:.6rem .75rem}.brand span{display:none}.tile .value{font-size:1.5rem}.hero .value{font-size:2.2rem}}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:2fr 1fr}
@media (max-width:900px){.g-2,.g-3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;min-width:0}
.card h2{margin:0;font-size:1rem;font-weight:700}
.card .sub{margin:.15rem 0 .75rem;font-size:.875rem;color:var(--ink-3)}
.card-head{display:flex;align-items:flex-start;gap:.75rem}
.card-head > div{flex:1;min-width:0}
.linkbtn{background:none;border:0;padding:.25rem;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:.875rem;white-space:nowrap}
/* tiles */
.tile .label{font-size:.875rem;color:var(--ink-2);font-weight:500}
.tile .value{font-size:1.9rem;font-weight:700;line-height:1.15;margin:.2rem 0;font-variant-numeric:tabular-nums}
.tile .delta{font-size:.8125rem;font-weight:600;color:var(--ink-3)}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.hero .value{font-size:3rem}
.hb{display:grid;gap:.45rem}
.hb-row{display:grid;grid-template-columns:minmax(0,var(--lw)) 1fr;align-items:center;gap:.75rem;font-size:.875rem;border-radius:6px;padding:.1rem .2rem}
.hb-row:hover,.hb-row:focus{background:#FAF9F5;outline:none}
.hb-l{text-align:right;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{display:flex;align-items:center;gap:.4rem;min-width:0}
.hb-f{height:16px;border-radius:0 4px 4px 0;flex:none;max-width:calc(100% - 3.5rem)}
.hb-v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:600px){.hb-row{grid-template-columns:minmax(0,40%) 1fr}}
.g-2,.g-3{align-items:start}
/* charts */
svg{display:block;max-width:100%}
.chart{position:relative}
.axis text{fill:var(--ink-3);font-size:12px}
.axis line,.gridline{stroke:var(--grid);stroke-width:1}
.mark{cursor:default;transition:opacity .1s}
.mark:hover,.mark:focus{opacity:.8;outline:none}
.legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;margin:.25rem 0 .5rem;font-size:.8125rem;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.35rem;vertical-align:-1px}
.tip{position:fixed;z-index:50;pointer-events:none;background:#1A1A1A;color:#fff;border-radius:8px;padding:.45rem .6rem;font-size:.8125rem;line-height:1.35;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip strong{display:block;font-size:.95rem}
.tip .k{display:inline-block;width:10px;height:2px;margin-right:.35rem;vertical-align:middle}
.empty{padding:1.5rem;text-align:center;color:var(--ink-3);font-size:.9375rem}
/* tables */
.tbl-wrap{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink-2);white-space:nowrap;background:var(--card);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#FAF9F5}
.row-btn{background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;text-decoration:underline;font-weight:600}
.pill{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap;background:#F0EFEB;color:var(--ink-2)}
.pill.new{background:#E8F1FC;color:#184f95}.pill.verified{background:#E6F4EC;color:#1E6B3E}.pill.offered{background:#FFF4D6;color:#7A5200}
.pill.sold,.pill.won{background:#1A1A1A;color:#fff}.pill.verified{background:#E8F1FC;color:#184f95}.pill.lost{background:#FFF4D6;color:#7A5200}
.pill.invalid,.pill.cancelled{background:#FDECEA;color:#B42318}
.pill.prospect{background:#E8F1FC;color:#184f95}.pill.active{background:#E6F4EC;color:#1E6B3E}.pill.paused{background:#FFF4D6;color:#7A5200}.pill.rejected{background:#FDECEA;color:#B42318}
.gap-bad{background:var(--bad-bg);color:var(--bad);font-weight:700}
.gap-ok{background:var(--good-bg);color:var(--good)}
.status-row{display:flex;gap:.5rem;align-items:flex-start;padding:.6rem .75rem;border-radius:8px;font-size:.875rem;margin-bottom:.5rem}
.status-row.bad{background:var(--bad-bg);color:var(--bad)}.status-row.warn{background:var(--warn-bg);color:var(--warn)}.status-row.good{background:var(--good-bg);color:var(--good)}
.status-row b{flex:none}
/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem 1rem}
.form .full{grid-column:1/-1}
@media (max-width:700px){.form{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:.25rem;font-size:.875rem;font-weight:600;color:var(--ink-2)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;background:#fff;font-weight:400;color:var(--ink);min-height:2.5rem}
label.f textarea{min-height:5rem;resize:vertical}
.pmap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:1rem 1.5rem;align-items:start}
@media (max-width:800px){.pmap{grid-template-columns:1fr}}
.pmap-svg circle:focus-visible{outline:none;stroke:#1A1A1A;stroke-width:2.5}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.25rem .75rem;font-size:.875rem}
/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:31;overflow:auto;padding:1.25rem 1.25rem 3rem;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer h2{margin:.25rem 0 .25rem;font-size:1.3rem}
.dl{display:grid;grid-template-columns:9rem 1fr;gap:.35rem .75rem;font-size:.9375rem;margin:.75rem 0}
.dl dt{color:var(--ink-3)}.dl dd{margin:0}
.timeline{list-style:none;margin:0;padding:0;font-size:.875rem}
.timeline li{padding:.4rem 0;border-bottom:1px solid var(--line)}
.timeline time{color:var(--ink-3);margin-right:.5rem}
.status-btns{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 1rem}
/* login */
.login{max-width:380px;margin:12vh auto;padding:0 1rem}
.login .card{padding:1.5rem}
.login h1{font-size:1.4rem;margin:0 0 .25rem}
.msg{font-size:.875rem;margin-top:.75rem}
.msg.err{color:var(--bad)}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:60;font-size:.9375rem}
.loading{opacity:.55;transition:opacity .2s}
.map path{stroke:#fff;stroke-width:1}
.map path:hover,.map path:focus{stroke:#1A1A1A;stroke-width:1.5;outline:none}
.scale{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--ink-3);margin-top:.4rem}
.scale span{display:inline-block;width:22px;height:10px}
.meter{display:grid;grid-template-columns:minmax(0,13rem) 1fr 3.2rem;align-items:center;gap:.6rem;font-size:.875rem;margin:.35rem 0}
.meter .track{height:10px;border-radius:5px;background:var(--seq-100);overflow:hidden}
.meter .fill{height:100%;background:var(--s1);border-radius:5px}
.meter .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Editable internal rental-price matrix */
.price-page{padding:1.25rem;max-width:none}
.price-title{font-size:1.2rem!important;margin-bottom:.3rem!important}
.price-toolbar{margin:1rem 0 .6rem}
.price-toolbar>input,.price-toolbar>select{min-height:2.5rem;border:1px solid var(--line);border-radius:8px;background:#fff;padding:.45rem .65rem}
.price-toolbar>input{min-width:220px;flex:1}
.price-scroll{max-height:calc(100vh - 345px);min-height:260px;margin-top:.65rem;border:1px solid var(--line);border-radius:8px}
.price-grid{min-width:1490px;table-layout:fixed}
.price-grid th,.price-grid td{padding:.3rem .35rem;vertical-align:middle}
.price-grid th{top:0;background:#f6f5f2;z-index:2}
.price-grid th:nth-child(1),.price-grid td:nth-child(1){width:165px;min-width:165px;position:sticky;left:0;background:#fff;z-index:1}
.price-grid th:nth-child(2),.price-grid td:nth-child(2){width:220px;min-width:220px;position:sticky;left:165px;background:#fff;z-index:1;box-shadow:2px 0 2px -1px var(--line)}
.price-grid th:nth-child(1),.price-grid th:nth-child(2){background:#f6f5f2;z-index:3}
.price-grid th:nth-child(3){width:185px}
.price-grid th:nth-child(n+4):nth-child(-n+8){width:110px}
.price-grid th:nth-child(9){width:210px}
.price-grid th:nth-child(10){width:95px}
.price-grid tr:hover td{background:#faf9f5}
.price-input{width:100%;min-width:0;padding:.35rem .4rem;border:1px solid transparent;background:transparent;border-radius:5px;font-size:.8rem;text-overflow:ellipsis}
.price-input:hover,.price-input:focus{border-color:#b7b5ae;background:#fff;outline:none}
.price-input:focus{outline:2px solid var(--accent);outline-offset:0}
.price-input.amount{text-align:right;font-variant-numeric:tabular-nums}
.price-input.price-saving{border-color:var(--accent);background:#fff8e5}
.price-input.price-saved{border-color:#8ec6a8}
.price-input.price-error{border-color:var(--bad);background:#fff1f1}
.price-input:disabled{opacity:.65;cursor:wait}
@media(max-width:700px){.price-page{padding:.75rem}.price-scroll{max-height:65vh}.price-toolbar>input{min-width:100%}}


.preview-banner{padding:.6rem 1rem;background:#fff0cc;border-bottom:1px solid #e4c67f;display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;font-size:.85rem;align-items:center}
.preview-banner strong{font-weight:800}.preview-banner a{text-decoration:underline}
.preview-tools{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.preview-tools button{min-height:2rem}
#main{max-width:1440px}
</style>
</head>
<body>
<div class="preview-banner">
 <span><strong>PRÉ-VISUALIZAÇÃO · DADOS DE DEMONSTRAÇÃO</strong> — É possível alterar os preços, mas as alterações não afetam o Supabase ou a Rentapa.</span>
 <span class="preview-tools">
 <button class="btn small" id="resetDemo" type="button">Limpar alterações de demonstração</button>
 <a href="https://github.com/senyagannokha/Rentapa/pull/71" target="_blank" rel="noopener noreferrer">Ver alterações no GitHub ↗</a>
 </span>
</div>
<div id="appView">
 <header class="top">
   <a class="brand" href="./index.html"><b>R</b><span>renta<em>pa</em></span></a>
   <nav class="tabs" aria-label="Secções de demonstração">
     <button class="tab" role="tab" aria-selected="true" type="button">Preços de aluguer</button>
   </nav>
   <span class="who">Modo de demonstração</span>
 </header>
 <main class="wrap" id="main">
   <div id="content" aria-live="polite"></div>
 </main>
</div>
<script src="./pricing.js"></script>
<script>
"use strict";
/* Runs the same pricing.js as the production admin but with local demo-only data. */
var $=function(id){return document.getElementById(id);};
function el(tag,attrs,children){
 var e=document.createElement(tag);
 if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
   if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;
   else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
   else e.setAttribute(k,v===true?"":v);}
 (children||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
 return e;
}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
function toast(msg){
 var t=el("div",{class:"toast",role:"status",text:msg});document.body.appendChild(t);
 setTimeout(function(){t.remove();},2400);
}
var REF={categories:[]},S={tab:"pricing",data:{}};
var STORE_KEY="rentapa-pricing-preview-v1";
var demoRecords={};
function restore(){
 try{var data=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");demoRecords=data&&typeof data==="object"&&!Array.isArray(data)?data:{};}
 catch(_){demoRecords={};}
}
function saveDemo(){try{localStorage.setItem(STORE_KEY,JSON.stringify(demoRecords));}catch(e){toast("Não foi possível guardar neste navegador: "+e.message);}}
function getKey(path){
 var raw=path.split("catalog_key=eq.")[1];
 return raw?JSON.parse(decodeURIComponent(raw)):"";
}
async function fetchAll(table){
 if(table!=="equipment_price_points")throw new Error("Tabela de demonstração não encontrada");
 return Object.values(demoRecords);
}
async function api(path,opts){
 if(!path.startsWith("equipment_price_points"))throw new Error("A demonstração não utiliza a base de dados real.");
 opts=opts||{};
 if(opts.method==="POST"){
   var data=opts.body;
   if(!data||!data.catalog_key)throw new Error("Chave inválida");
   demoRecords[data.catalog_key]=Object.assign({},demoRecords[data.catalog_key]||{},data);
   saveDemo();return [demoRecords[data.catalog_key]];
 }
 var key=getKey(path);
 if(opts.method==="PATCH"){
   if(!demoRecords[key])return [];
   demoRecords[key]=Object.assign({},demoRecords[key],opts.body);
   saveDemo();return [demoRecords[key]];
 }
 if(opts.method==="DELETE"){
   delete demoRecords[key];saveDemo();return [];
 }
 throw new Error("Operação de demonstração desconhecida");
}
$("resetDemo").addEventListener("click",function(){
 if(!confirm("Limpar todas as alterações feitas nesta demonstração?"))return;
 demoRecords={};saveDemo();location.reload();
});
(async function(){
 restore();
 try{
   var response=await fetch("./reference.json",{cache:"no-store"});
   if(!response.ok)throw new Error("Catálogo indisponível (HTTP "+response.status+")");
   REF=await response.json();
   if(!Array.isArray(REF.categories)||!REF.categories.length)throw new Error("Catálogo vazio");
   viewPricing();
 }catch(e){
   $("content").appendChild(el("div",{class:"card status-row bad",text:"Erro ao abrir a demonstração: "+e.message}));
 }
})();
</script>
</body>
</html>
